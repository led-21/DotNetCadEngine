name: Package Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-installer:
    name: Build & Package Windows Installer (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress --yes

      - name: Add Inno Setup to PATH
        run: |
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and Package Installer
        shell: powershell
        run: |
          .\build-installer.ps1 -Configuration Release -Runtime win-x64

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DotNetCadEngine-Installer-x64
          path: |
            artifacts/installer/*.exe
            artifacts/installer/*.txt
          if-no-files-found: error
