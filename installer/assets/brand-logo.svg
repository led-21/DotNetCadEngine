<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="#334155" stroke-width="12" />

  <!-- Technical Grid Dots -->
  <g fill="#334155" opacity="0.6">
    <circle cx="120" cy="120" r="4" /><circle cx="184" cy="120" r="4" /><circle cx="248" cy="120" r="4" /><circle cx="312" cy="120" r="4" /><circle cx="376" cy="120" r="4" />
    <circle cx="120" cy="184" r="4" /><circle cx="184" cy="184" r="4" /><circle cx="248" cy="184" r="4" /><circle cx="312" cy="184" r="4" /><circle cx="376" cy="184" r="4" />
    <circle cx="120" cy="248" r="4" /><circle cx="184" cy="248" r="4" /><circle cx="248" cy="248" r="4" /><circle cx="312" cy="248" r="4" /><circle cx="376" cy="248" r="4" />
    <circle cx="120" cy="312" r="4" /><circle cx="184" cy="312" r="4" /><circle cx="248" cy="312" r="4" /><circle cx="312" cy="312" r="4" /><circle cx="376" cy="312" r="4" />
    <circle cx="120" cy="376" r="4" /><circle cx="184" cy="376" r="4" /><circle cx="248" cy="376" r="4" /><circle cx="312" cy="376" r="4" /><circle cx="376" cy="376" r="4" />
  </g>

  <!-- Technical Coordinate Axis Lines -->
  <line x1="88" y1="392" x2="424" y2="392" stroke="#475569" stroke-width="6" stroke-dasharray="12 6" />
  <line x1="120" y1="424" x2="120" y2="88" stroke="#475569" stroke-width="6" stroke-dasharray="12 6" />

  <!-- CAD Drafting Geometry: Arc -->
  <path d="M 120,392 A 200,200 0 0,1 320,192" fill="none" stroke="#0284C7" stroke-width="8" stroke-dasharray="8 6" opacity="0.8" />

  <!-- Main Technical Shape: Isometric Drafting Bracket -->
  <polygon points="120,392 392,392 392,280 248,280 248,120 120,120" fill="#1E293B" fill-opacity="0.75" stroke="#38BDF8" stroke-width="14" stroke-linejoin="round" />

  <!-- Dimension line with arrows -->
  <g stroke="#38BDF8" stroke-width="4" fill="#38BDF8">
    <line x1="120" y1="428" x2="392" y2="428" />
    <line x1="120" y1="408" x2="120" y2="444" />
    <line x1="392" y1="408" x2="392" y2="444" />
    <!-- Arrow Left -->
    <polygon points="120,428 136,422 136,434" />
    <!-- Arrow Right -->
    <polygon points="392,428 376,422 376,434" />
  </g>

  <!-- Precision Snap Markers -->
  <!-- Endpoint Square -->
  <rect x="110" y="382" width="20" height="20" fill="none" stroke="#F8FAFC" stroke-width="4" />
  <!-- Corner Square -->
  <rect x="382" y="382" width="20" height="20" fill="none" stroke="#F8FAFC" stroke-width="4" />
  <!-- Vertex Snap Square -->
  <rect x="238" y="270" width="20" height="20" fill="none" stroke="#38BDF8" stroke-width="4" />
  <!-- Center Snap Circle -->
  <circle cx="120" cy="120" r="8" fill="#38BDF8" />
  <circle cx="392" cy="280" r="8" fill="#38BDF8" />

  <!-- Tech Center Crosshair -->
  <g stroke="#38BDF8" stroke-width="3">
    <line x1="240" y1="248" x2="256" y2="248" />
    <line x1="248" y1="240" x2="248" y2="256" />
    <circle cx="248" cy="248" r="16" fill="none" stroke="#38BDF8" stroke-width="3" />
  </g>
</svg>
