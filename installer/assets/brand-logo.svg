<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Slate Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>

    <!-- Outer Rim Stroke Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#1E293B" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Vibrant Electric Cyan / Azure Gradients -->
    <linearGradient id="cyanPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="cyanHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="strutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="darkFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B1323" stop-opacity="0.95" />
    </linearGradient>

    <!-- Radial Blueprint Glow -->
    <radialGradient id="blueprintGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Base Squircle / Rounded Tech Slate Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4" filter="url(#softShadow)" />

  <!-- 2. Blueprint Ambient Radial Center Glow -->
  <circle cx="256" cy="256" r="216" fill="url(#blueprintGlow)" />

  <!-- 3. Technical CAD Blueprint Grid & Dial Rings -->
  <g opacity="0.28">
    <!-- Concentric Dial Rings -->
    <circle cx="256" cy="256" r="184" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="136" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 6" />
    <circle cx="256" cy="256" r="80" fill="none" stroke="#94A3B8" stroke-width="1" />

    <!-- Coordinate Crosshair Lines -->
    <line x1="72" y1="256" x2="440" y2="256" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 6" />
    <line x1="256" y1="72" x2="256" y2="440" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 6" />
    
    <!-- 45-degree angle construction ray lines -->
    <line x1="128" y1="128" x2="384" y2="384" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="128" y1="384" x2="384" y2="128" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- 4. Deep Contrast Monogram Shadow / Back Facet -->
  <path d="M 172,120 L 276,120 C 356,120 400,176 400,256 C 400,336 356,392 276,392 L 172,392 Z"
        fill="url(#darkFacet)" stroke="#334155" stroke-width="3" filter="url(#softShadow)" />

  <!-- 5. Inner CAD Drafting Aperture (Precision Dark Void) -->
  <path d="M 236,188 L 272,188 C 314,188 334,216 334,256 C 334,296 314,324 272,324 L 236,324 Z"
        fill="#080D18" stroke="#1E293B" stroke-width="2" />

  <!-- 6. Diagonal Drafting Truss / 45-degree Structural Strut -->
  <polygon points="180,364 340,204 364,228 204,388" fill="url(#strutGrad)" opacity="0.9" />
  <line x1="180" y1="364" x2="340" y2="204" stroke="#BAE6FD" stroke-width="2" />

  <!-- 7. Outer Sweeping CAD Drafting Arc (The "D" Curve Ribbon) -->
  <path d="M 200,124 C 342,124 396,182 396,256 C 396,330 342,388 200,388"
        fill="none" stroke="url(#cyanPrimary)" stroke-width="28" stroke-linecap="round" />

  <!-- Inner Precision Arc Highlight Filament -->
  <path d="M 214,131 C 332,131 382,186 382,256 C 382,326 332,381 214,381"
        fill="none" stroke="url(#cyanHighlight)" stroke-width="4.5" stroke-linecap="round" opacity="0.95" filter="url(#nodeGlow)" />

  <!-- 8. Primary Precision Vertical Spine / Caliper Ruler -->
  <rect x="152" y="110" width="52" height="292" rx="14" fill="url(#spineGrad)" stroke="#BAE6FD" stroke-width="2.5" filter="url(#softShadow)" />

  <!-- Spine Precision Ruler Graduations (Ticks) -->
  <g stroke="#0369A1" stroke-width="3" stroke-linecap="round">
    <line x1="152" y1="148" x2="174" y2="148" />
    <line x1="152" y1="178" x2="166" y2="178" stroke-width="2" />
    <line x1="152" y1="208" x2="174" y2="208" />
    <line x1="152" y1="238" x2="166" y2="238" stroke-width="2" />
    <line x1="152" y1="268" x2="174" y2="268" />
    <line x1="152" y1="298" x2="166" y2="298" stroke-width="2" />
    <line x1="152" y1="328" x2="174" y2="328" />
    <line x1="152" y1="358" x2="166" y2="358" stroke-width="2" />
  </g>

  <!-- 9. Precision CAD Snap Nodes (Luminous Geometric Anchors) -->
  <!-- Top Anchor Snap Node -->
  <g filter="url(#nodeGlow)">
    <circle cx="200" cy="124" r="11" fill="#FFFFFF" stroke="#0284C7" stroke-width="4" />
    <rect x="194" y="118" width="12" height="12" fill="none" stroke="#0284C7" stroke-width="2" />
  </g>

  <!-- Right Apex Tangent Snap Node -->
  <g filter="url(#nodeGlow)">
    <circle cx="396" cy="256" r="13" fill="#FFFFFF" stroke="#0284C7" stroke-width="4.5" />
    <circle cx="396" cy="256" r="5" fill="#38BDF8" />
  </g>

  <!-- Bottom Anchor Snap Node -->
  <g filter="url(#nodeGlow)">
    <circle cx="200" cy="388" r="11" fill="#FFFFFF" stroke="#0284C7" stroke-width="4" />
    <rect x="194" y="382" width="12" height="12" fill="none" stroke="#0284C7" stroke-width="2" />
  </g>

  <!-- Strut Intersection Node -->
  <circle cx="340" cy="204" r="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" filter="url(#nodeGlow)" />

  <!-- Center Coordinate Target Datum (Drafting Crosshair) -->
  <circle cx="272" cy="256" r="9" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.9" />
  <line x1="258" y1="256" x2="286" y2="256" stroke="#38BDF8" stroke-width="2" opacity="0.9" />
  <line x1="272" y1="242" x2="272" y2="270" stroke="#38BDF8" stroke-width="2" opacity="0.9" />
</svg>
